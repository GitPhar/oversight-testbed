# Publishes site/ to GitHub Pages. No build step: site/assemble.sh only copies files.
# The site reads the engine's ledger/ and map/, and programs/<name>/ in this same repository (program 1's paper/,
# audits/SUMMARY.md and usage ledgers; program 3's map), at the commit being deployed. No other repository is checked out.
# It redeploys on every push to main (any path: the gauges read CONTEXT.md and the ledger), every hour (so a push
# to a program repository shows within the hour), on demand, and on a "program-updated" repository_dispatch.
# Before laying out the site it regenerates ledger/brier.md and ledger/scores.md, so no gauge reads a stale summary.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"        # hourly, at :17 (picks up program-repository pushes)
  workflow_dispatch:
  repository_dispatch:
    types: [program-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # queue, never cancel a deploy mid-flight (a cancelled deploy can hang the next one)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Denver
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: assemble.sh reads each ledger commit's time (data/commit-times.json)
      - name: Regenerate the ledger summaries
        run: python3 ledger/brier.py && python3 ledger/scores.py
      - name: Lay out the site
        run: site/assemble.sh _site programs/entangled-mind programs/nature-graded
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
