<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#888"/></marker></defs>
  <rect width="1200" height="900" fill="#15161a"/>
  <text x="600" y="32" fill="#fff" font-size="20" text-anchor="middle" font-weight="bold">The oversight testbed — as built on 2026-11-04</text>
  <text x="600" y="54" fill="#999" font-size="12" text-anchor="middle">gold = the human's hand · green = cannot be fooled · red = could fool itself without the check below it · grey = built and running</text>
  <rect x="40" y="80" width="230" height="60" rx="8" fill="#1d1f25" stroke="#666"/>
  <text x="155" y="104" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Adjacent research, all fields</text>
  <text x="155" y="124" fill="#bbb" font-size="11" text-anchor="middle">full reads · "what to do next" extracted</text>
  <rect x="485" y="80" width="230" height="60" rx="8" fill="#2a2416" stroke="#e8b84a" stroke-width="2"/>
  <text x="600" y="104" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Seed questions (one per program)</text>
  <text x="600" y="124" fill="#e8b84a" font-size="11" text-anchor="middle">chosen by Sean · logged as steers</text>
  <rect x="930" y="80" width="230" height="60" rx="8" fill="#1d1f25" stroke="#5cb85c" stroke-width="2"/>
  <text x="1045" y="104" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">The ledger, read first</text>
  <text x="1045" y="124" fill="#a0e0a0" font-size="11" text-anchor="middle">bets · audits · lessons · kills (feedback loop)</text>
  <line x1="155" y1="140" x2="520" y2="180" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="140" x2="600" y2="180" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1045" y1="140" x2="680" y2="180" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <rect x="400" y="180" width="400" height="64" rx="8" fill="#1d1f25" stroke="#666"/>
  <text x="600" y="204" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">SCOUT → MAP (per program)</text>
  <text x="600" y="224" fill="#bbb" font-size="11" text-anchor="middle">directions ranked: assumption · cheapest test · cost · engine odds · lesson line</text>
  <rect x="40" y="180" width="300" height="64" rx="8" fill="#2a2416" stroke="#e8b84a" stroke-width="2"/>
  <text x="190" y="204" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">COCKPIT (the human's hand)</text>
  <text x="190" y="222" fill="#e8b84a" font-size="11" text-anchor="middle">odds on directions, before data</text>
  <text x="190" y="236" fill="#e8b84a" font-size="11" text-anchor="middle">vetoes (shadow-tested) · added questions</text>
  <line x1="340" y1="212" x2="400" y2="212" stroke="#e8b84a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="244" x2="600" y2="280" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <rect x="400" y="280" width="400" height="62" rx="8" fill="#1d1f25" stroke="#5cb85c" stroke-width="2"/>
  <text x="600" y="302" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">PRE-REGISTER → DESIGN REVIEW (fresh auditor says "go")</text>
  <text x="600" y="320" fill="#a0e0a0" font-size="11" text-anchor="middle">pass rule · budget in code · pre-mortem · beacon seed</text>
  <text x="600" y="334" fill="#a0e0a0" font-size="11" text-anchor="middle">a gate script blocks any bet missing one</text>
  <line x1="600" y1="342" x2="600" y2="370" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="370" width="260" height="44" rx="8" fill="#1d1f25" stroke="#666"/>
  <text x="600" y="397" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">RUN (cheapest falsifier first)</text>
  <line x1="520" y1="414" x2="190" y2="460" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="414" x2="600" y2="460" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="680" y1="414" x2="1010" y2="460" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <rect x="40" y="460" width="300" height="90" rx="8" fill="#3a2a2a" stroke="#d9534f"/>
  <text x="190" y="484" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Referee 1: another model</text>
  <text x="190" y="504" fill="#f0a0a0" font-size="11" text-anchor="middle">programs 1 &amp; 2 (model psychology, other minds)</text>
  <text x="190" y="522" fill="#f0a0a0" font-size="11" text-anchor="middle">soft · arguable · scored on the calibration page</text>
  <text x="190" y="540" fill="#bbb" font-size="10" text-anchor="middle">entangled-mind · other-minds</text>
  <rect x="450" y="460" width="300" height="90" rx="8" fill="#243a2a" stroke="#5cb85c" stroke-width="2"/>
  <text x="600" y="484" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Referee 2: the quantum chip</text>
  <text x="600" y="504" fill="#a0e0a0" font-size="11" text-anchor="middle">program 3 (device physics on ibm_fez)</text>
  <text x="600" y="522" fill="#a0e0a0" font-size="11" text-anchor="middle">hard · physics decides · scored on the calibration page</text>
  <text x="600" y="540" fill="#bbb" font-size="10" text-anchor="middle">nature-graded · also: certified seeds, tie-breaker bets</text>
  <rect x="860" y="460" width="300" height="90" rx="8" fill="#243a2a" stroke="#5cb85c" stroke-width="2"/>
  <text x="1010" y="484" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">Referee 3: the published record</text>
  <text x="1010" y="504" fill="#a0e0a0" font-size="11" text-anchor="middle">program 4 (bets on masked, already-settled results)</text>
  <text x="1010" y="522" fill="#a0e0a0" font-size="11" text-anchor="middle">hard · masked items · the bettor has no web</text>
  <text x="1010" y="540" fill="#bbb" font-size="10" text-anchor="middle">settled-science · the engine's training ledger</text>
  <line x1="190" y1="550" x2="520" y2="600" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="550" x2="600" y2="600" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <line x1="1010" y1="550" x2="680" y2="600" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <rect x="400" y="600" width="400" height="64" rx="8" fill="#1d1f25" stroke="#5cb85c" stroke-width="2"/>
  <text x="600" y="624" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">AUDITOR (fresh session, adversarial, published)</text>
  <text x="600" y="644" fill="#a0e0a0" font-size="11" text-anchor="middle">every audit published · cuts and reversals on the instruments page</text>
  <rect x="860" y="600" width="300" height="64" rx="8" fill="#1d1f25" stroke="#5cb85c" stroke-width="2"/>
  <text x="1010" y="624" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">AUDITOR OF THE AUDITOR</text>
  <text x="1010" y="644" fill="#a0e0a0" font-size="11" text-anchor="middle">plants a known-bad claim · catch rate published</text>
  <line x1="860" y1="632" x2="800" y2="632" stroke="#5cb85c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="600" y1="664" x2="600" y2="700" stroke="#888" stroke-width="2" marker-end="url(#a)"/>
  <rect x="200" y="700" width="800" height="70" rx="8" fill="#2a2416" stroke="#e8b84a" stroke-width="2"/>
  <text x="600" y="724" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">LEDGER — the thing Anthropic reads</text>
  <text x="600" y="744" fill="#e8b84a" font-size="11" text-anchor="middle">engine Brier by referee · human Brier · steers scored · vetoes shadow-tested · lessons · kills with diagnoses · spend</text>
  <text x="600" y="762" fill="#bbb" font-size="10" text-anchor="middle">feeds the next map (arrow back to the top right) · drives the site: map, cockpit, instruments, calibration, record, papers</text>
  <path d="M 1000 735 C 1180 735, 1180 110, 1160 110" stroke="#e8b84a" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <rect x="40" y="800" width="1120" height="70" rx="8" fill="#1d1f25" stroke="#666"/>
  <text x="600" y="824" fill="#fff" font-size="13" text-anchor="middle" font-weight="bold">OPERATORS (run without any chat)</text>
  <text x="600" y="844" fill="#bbb" font-size="11" text-anchor="middle">7:03am morning operator: reads CONTEXT + TASKS + ledger → brief + the day's wave, one paste per tab · 11:33pm nightly updater: rewrites CONTEXT + TASKS from the day's commits</text>
  <text x="600" y="862" fill="#bbb" font-size="11" text-anchor="middle">brain = GitPhar/oversight-testbed: CONTEXT.md, TASKS.md, ARCHITECTURE.md, proposal.md · programs live inside as programs/&lt;name&gt; · site = gitphar.github.io/oversight-testbed</text>
</svg>
