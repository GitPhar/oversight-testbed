<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Figure 1. Test-set AUROC of the exact conflict score at each circuit stage (run 2, 40 wrong + 40 right)</title>
  <rect width="560" height="360" fill="#ffffff"/>
  <!-- axes -->
  <line x1="70" y1="280" x2="530" y2="280" stroke="#333"/>
  <line x1="70" y1="30" x2="70" y2="280" stroke="#333"/>
  <!-- y ticks: y = 280 - (v-0.40)/0.35*250 -->
  <g fill="#333" text-anchor="end">
    <line x1="65" y1="280" x2="70" y2="280" stroke="#333"/><text x="61" y="284">0.40</text>
    <line x1="65" y1="208.6" x2="70" y2="208.6" stroke="#333"/><text x="61" y="212.6">0.50</text>
    <line x1="65" y1="137.1" x2="70" y2="137.1" stroke="#333"/><text x="61" y="141.1">0.60</text>
    <line x1="65" y1="65.7" x2="70" y2="65.7" stroke="#333"/><text x="61" y="69.7">0.70</text>
  </g>
  <text x="20" y="155" fill="#333" transform="rotate(-90 20 155)" text-anchor="middle">test-set AUROC (wrong vs right)</text>
  <!-- chance line -->
  <line x1="70" y1="208.6" x2="530" y2="208.6" stroke="#999" stroke-dasharray="4 4"/>
  <text x="76" y="203" fill="#777" text-anchor="start">chance</text>
  <!-- x ticks -->
  <g fill="#333" text-anchor="middle">
    <text x="110" y="300">encode</text>
    <text x="243" y="300">entangle</text>
    <text x="377" y="300">evolve 1</text>
    <text x="510" y="300">evolve 2</text><text x="510" y="314" font-size="11" fill="#555">(measured)</text>
  </g>
  <text x="300" y="330" fill="#333" text-anchor="middle">circuit stage</text>
  <!-- arm C: no entangling gates -->
  <polyline points="110,115.7 243,115.7 377,64.3 510,77.9" fill="none" stroke="#1f77b4" stroke-width="2.5"/>
  <g fill="#1f77b4">
    <circle cx="110" cy="115.7" r="4"/><circle cx="243" cy="115.7" r="4"/><circle cx="377" cy="64.3" r="4"/><circle cx="510" cy="77.9" r="4"/>
  </g>
  <!-- arm A: entangled -->
  <polyline points="110,115.7 243,140.0 377,193.6 510,218.6" fill="none" stroke="#d62728" stroke-width="2.5"/>
  <g fill="#d62728">
    <circle cx="110" cy="115.7" r="4"/><circle cx="243" cy="140.0" r="4"/><circle cx="377" cy="193.6" r="4"/><circle cx="510" cy="218.6" r="4"/>
  </g>
  <!-- value labels -->
  <g font-size="11">
    <text x="110" y="104" fill="#555" text-anchor="middle">0.63</text>
    <text x="243" y="104" fill="#1f77b4" text-anchor="middle">0.63</text>
    <text x="243" y="157" fill="#d62728" text-anchor="middle">0.60</text>
    <text x="377" y="54" fill="#1f77b4" text-anchor="middle">0.70</text>
    <text x="377" y="210" fill="#d62728" text-anchor="middle">0.52</text>
    <text x="510" y="67" fill="#1f77b4" text-anchor="middle">0.68</text>
    <text x="510" y="236" fill="#d62728" text-anchor="middle">0.49</text>
  </g>
  <!-- legend -->
  <g>
    <line x1="90" y1="345" x2="115" y2="345" stroke="#1f77b4" stroke-width="2.5"/><text x="121" y="349" fill="#333">arm C: same circuit, no entangling gates</text>
    <line x1="350" y1="345" x2="375" y2="345" stroke="#d62728" stroke-width="2.5"/><text x="381" y="349" fill="#333">arm A: entangled</text>
  </g>
</svg>
