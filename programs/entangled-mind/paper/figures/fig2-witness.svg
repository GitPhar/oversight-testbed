<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Figure 2. Negativity of the most-entangled related pair on ibm_fez, with 95% intervals</title>
  <rect width="560" height="360" fill="#ffffff"/>
  <!-- y = 280 - N*1250 -->
  <line x1="70" y1="30" x2="70" y2="280" stroke="#333"/>
  <line x1="70" y1="280" x2="530" y2="280" stroke="#333"/>
  <g fill="#333" text-anchor="end">
    <line x1="65" y1="280" x2="70" y2="280" stroke="#333"/><text x="61" y="284">0</text>
    <line x1="65" y1="217.5" x2="70" y2="217.5" stroke="#333"/><text x="61" y="221.5">0.05</text>
    <line x1="65" y1="155" x2="70" y2="155" stroke="#333"/><text x="61" y="159">0.10</text>
    <line x1="65" y1="92.5" x2="70" y2="92.5" stroke="#333"/><text x="61" y="96.5">0.15</text>
    <line x1="65" y1="30" x2="70" y2="30" stroke="#333"/><text x="61" y="34">0.20</text>
  </g>
  <text x="20" y="155" fill="#333" transform="rotate(-90 20 155)" text-anchor="middle">negativity N (separable states: 0)</text>
  <text x="526" y="274" fill="#777" text-anchor="end">N = 0: separable (certified if the interval's lower bound &gt; 0)</text>
  <g fill="#333" text-anchor="middle">
    <text x="160" y="300">h221</text><text x="300" y="300">h088</text><text x="440" y="300">h268</text>
  </g>
  <!-- ideal: grey diamonds -->
  <g fill="#888">
    <rect x="120" y="46" width="8" height="8" transform="rotate(45 124 50)"/>
    <rect x="260" y="57.25" width="8" height="8" transform="rotate(45 264 61.25)"/>
    <rect x="400" y="73.5" width="8" height="8" transform="rotate(45 404 77.5)"/>
  </g>
  <!-- noisy simulator: blue, with CI -->
  <g stroke="#1f77b4" stroke-width="2">
    <line x1="148" y1="83.75" x2="148" y2="53.75"/><line x1="288" y1="107.5" x2="288" y2="77.5"/><line x1="428" y1="148.75" x2="428" y2="115"/>
  </g>
  <g fill="#1f77b4"><circle cx="148" cy="66.25" r="4.5"/><circle cx="288" cy="93.75" r="4.5"/><circle cx="428" cy="132.5" r="4.5"/></g>
  <!-- hardware, readout-mitigated: red, with CI -->
  <g stroke="#d62728" stroke-width="2">
    <line x1="172" y1="112.5" x2="172" y2="83.75"/><line x1="312" y1="216.25" x2="312" y2="186.25"/><line x1="452" y1="211.25" x2="452" y2="178.75"/>
  </g>
  <g fill="#d62728"><circle cx="172" cy="96.25" r="5"/><circle cx="312" cy="201.25" r="5"/><circle cx="452" cy="196.25" r="5"/></g>
  <!-- hardware, unmitigated: open red -->
  <g fill="none" stroke="#d62728" stroke-width="1.5"><circle cx="196" cy="105" r="4.5"/><circle cx="336" cy="215" r="4.5"/><circle cx="476" cy="207.5" r="4.5"/></g>
  <g font-size="11" fill="#d62728" text-anchor="middle">
    <text x="172" y="128">0.147</text><text x="312" y="232">0.063</text><text x="452" y="227">0.067</text>
  </g>
  <!-- legend -->
  <g>
    <rect x="76" y="331" width="8" height="8" fill="#888" transform="rotate(45 80 335)"/><text x="90" y="339" fill="#333">ideal</text>
    <circle cx="140" cy="335" r="4.5" fill="#1f77b4"/><text x="150" y="339" fill="#333">noisy simulator</text>
    <circle cx="265" cy="335" r="5" fill="#d62728"/><text x="275" y="339" fill="#333">ibm_fez, readout-mitigated</text>
    <circle cx="440" cy="335" r="4.5" fill="none" stroke="#d62728" stroke-width="1.5"/><text x="450" y="339" fill="#333">unmitigated</text>
  </g>
</svg>
